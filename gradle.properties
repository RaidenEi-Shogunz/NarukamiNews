# -----------------------------------------
# ? Project-wide Gradle Settings - NarukamiNews ?
# -----------------------------------------

# JVM t?i ?u h?a cho Kotlin + Compose
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# B?t AndroidX + Build t?i ?u
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true

# Kotlin settings
kotlin.code.style=official
kotlin.incremental=true
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.useFallbackStrategy=false

# -------------------------------
# ? Compose Compiler Optimization
# -------------------------------
# B?t ch? ?? Compose hi?n ??i (Compose Compiler 1.7+ / Kotlin 2.0+)
compose.multiplatform.enabled=true
compose.compiler.enableStrongSkippingMode=true
android.enableComposeCompilerMetrics=false
android.enableComposeCompilerReports=false

# -------------------------------
# ? Build Optimization
# -------------------------------
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.parallel=true
org.gradle.vfs.watch=true

# -------------------------------
# ? Kotlin 2.0.21 + Compose 1.7.x sync stability
# -------------------------------
# Ng?n l?i IDE "Composable invocations..." do compile mismatch
kotlin.incremental.useClasspathSnapshot=true
kotlin.incremental.js.ir=true
kotlin.experimental.tryK2=true
